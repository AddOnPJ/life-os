# 生活の期限の台帳。金額・口座・番号は書かない（お金の詳細は PC の secure/）
# status: open / done / dropped
# repeat: yearly / monthly / none（done にしたら、次の期限をエージェントが足す）
# levels: 期限からの日数で段階を決める（負＝前）。省略時 {注意: -14, 警告: -3, 最優先: 0}
# 足し方：スマホの Claude Code に「期限 ◯◯ 2027-03-01」と送る（quick-log が足す）
deadlines:
